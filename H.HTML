<style>
     :root{
      --bg:#eaeef4;            /* page bg */
      --ink:#111827;           /* main text */
      --muted:#6b7280;         /* muted text */
      --card:#ffffff;          /* surfaces */
      --chip:#f3f4f6;          /* input chip */
      --chip-ink:#111827;      
      --line:#e5e7eb;          /* borders */
      --soft:#f8fafc;          /* inner soft */
      --accent:#111111;        /* dark pill */
      --brand:#f6c94c;         /* warm accent (yellow) */
      --brand-soft:#fff6ce;    /* pale yellow */
      --good:#10b981;
      --warn:#f59e0b;
      --bad:#ef4444;
      --shadow: 0 8px 24px rgba(0,0,0,.08);
      --radius: 18px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0; font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial; background:var(--bg); color:var(--ink)}

    /* ===== background blobs ===== */
    .bg-wrap{position:fixed; inset:0; pointer-events:none; z-index:-1}
    .blob{position:absolute; filter:blur(60px); opacity:.6}
    .blob.one{width:520px; height:520px; left:-160px; top:-120px; background:radial-gradient(circle at 30% 30%, #ffe89a, #ffd66b 40%, rgba(255,214,107,0) 60%)}
    .blob.two{width:520px; height:520px; right:-160px; bottom:-120px; background:radial-gradient(circle at 70% 70%, #ffd66b, #ffe89a 40%, rgba(255,214,107,0) 60%)}

    /* ===== shell ===== */
    .shell{max-width:1600px; margin:32px auto; padding:16px}

    .app{background:linear-gradient(135deg, rgba(255,255,255,.85), rgba(255,255,255,.7)); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:28px; overflow:hidden}

    header.appbar{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; background:linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.55)); backdrop-filter: blur(10px)}
    .brand{display:flex; align-items:center; gap:10px}
    .brand-badge{background:#111; color:#fff; border-radius:18px; padding:6px 10px; font-weight:700; font-size:.9rem}
    .nav{display:flex; gap:8px; align-items:center}
    .nav a{padding:8px 12px; border-radius:999px; text-decoration:none; color:#000; opacity:.7}
    .nav a.active{background:#111; color:#fff; opacity:1}

    .tray{display:flex; align-items:center; gap:10px}
    .icon-btn{height:38px; width:38px; display:grid; place-items:center; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 4px 12px rgba(0,0,0,.05);}

    /* ===== title + stats row ===== */
    .bar{ display:flex; flex-wrap:wrap; gap:16px; align-items:center}
    .bar h1{flex:1 1 auto; margin-left: 2rem;}

    .meters{display:flex; gap:14px; align-items:center}
    .meter{background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:8px 12px; display:flex; align-items:center; gap:10px; min-width:190px}
    .meter .label{font-size:.86rem; color:var(--muted)}
    .progress{flex:1; height:12px; background:#fff; border:1px solid var(--line); border-radius:999px; padding:2px}
    .progress > span{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg, #ffe8a1, #ffd35a)}
    .pct{font-weight:700; font-size:.9rem}

    .toggles{display:flex; gap:10px}
    .seg{background:var(--soft); border:1px solid var(--line); border-radius:999px; padding:4px; display:flex; align-items:center; gap:4px}
    .seg button{border:0; background:transparent; padding:6px 10px; border-radius:999px; font-weight:600; color:#374151}
    .seg button.active{background:#111; color:#fff}

    /* ===== toolbar ===== */
    .toolbar{padding:10px 22px 18px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
    .pill{background:#fff; border:1px dashed var(--line); color:#374151; border-radius:999px; padding:10px 12px; display:flex; align-items:center; gap:8px}
    .pill .fa{opacity:.7}
    .spacer{flex:1}
    .btn{background:#fff; border:1px solid var(--line); padding:9px 12px; border-radius:12px; display:flex; align-items:center; gap:8px; font-weight:600}
    .btn.ghost{background:transparent}
    .btn.brand{background:linear-gradient(180deg, #fff7d6, #ffe99f); border-color:#f7de92}

    .search{flex:1 1 360px; display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:999px; padding:10px 12px}
    .search input{border:0; outline:0; flex:1; font-size:.98rem; background:transparent}

    /* ===== table card ===== */
    .card{margin:0 22px 22px; padding:12px; background:linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.8)); border:1px solid var(--line); border-radius:24px; box-shadow:var(--shadow)}

    table{width:100%; border-collapse:separate; border-spacing:0 10px}
    thead th{font-size:.82rem; color:#6b7280; font-weight:600; text-align:left; padding:10px 14px}
    tbody td{background:#fff; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:14px}
    tbody tr{transition:transform .06s ease}
    tbody tr:hover{transform:translateY(-1px)}
    tbody tr td:first-child{border-left:1px solid var(--line); border-radius:14px 0 0 14px}
    tbody tr td:last-child{border-right:1px solid var(--line); border-radius:0 14px 14px 0}

    .row-highlight{background:linear-gradient(90deg, #fff7d4, #fff);}

    .avatar{display:flex; align-items:center; gap:10px}
    .avatar .ph{height:32px; width:32px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:700}

    .flag{font-size:18px;}

    .chip{display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:999px; font-size:.82rem; border:1px solid var(--line); background:var(--chip); color:#374151}
    .chip.good{border-color:#bbf7d0; background:#ecfdf5; color:#065f46}
    .chip.warn{border-color:#fde68a; background:#fffbeb; color:#92400e}
    .chip.bad{border-color:#fecaca; background:#fef2f2; color:#991b1b}

    .status-dot{display:inline-block; width:8px; height:8px; border-radius:50%}

    .btn-mini{border:1px solid var(--line); background:#fff; padding:8px 12px; border-radius:10px; font-weight:600}
    .btn-mini.brand{background:linear-gradient(180deg,#fff7d6,#ffe99f); border-color:#f7de92}

    /* dropdowns */
    .menu{position:relative}
    .menu-list{position:absolute; top:calc(100% + 6px); left:0; min-width:220px; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:8px; display:none; z-index:5}
    .menu.open .menu-list{display:block}
    .menu-list .row{display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border-radius:8px; cursor:pointer}
    .menu-list .row:hover{background:#f3f4f6}

    .cols{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:6px}
    .switch{--h:20px; width:36px; height:var(--h); border-radius:999px; border:1px solid var(--line); background:#f3f4f6; position:relative}
    .switch i{position:absolute; top:1px; left:1px; height:calc(var(--h) - 2px); width:calc(var(--h) - 2px); background:#fff; border:1px solid var(--line); border-radius:50%; transition:left .2s}
    .switch.on{background:#111}
    .switch.on i{left:calc(100% - var(--h) + 1px); background:#fff}

    .right-actions{display:flex; gap:8px; align-items:center}

    .hint{color:#6b7280; font-size:.85rem}

    @media (max-width:900px){
      .nav{display:none}
      .meters{flex:1 1 100%}
      .search{flex:1 1 100%}
      .toolbar{gap:8px}
      thead{display:none}
      table{border-spacing:0}
      tbody td{display:block; border:0; border-bottom:1px solid var(--line)}
      tbody tr td:first-child, tbody tr td:last-child{border-radius:0}
    }
/* 🔸 تصميم الأزرار بأسلوب meter */
.view-meters {
  display: flex;
  gap: 14px;
  align-items: center;
}

.view-option {
  background: var(--soft);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 150px;
  justify-content: center;
  cursor: pointer;
  transition: all 0.25s ease;
  box-shadow: 0 3px 8px rgba(0,0,0,0.05);
}

.view-option i {
  font-size: 1.1rem;
  color: #111;
  opacity: 0.85;
  transition: transform 0.2s ease;
}

.view-option .label {
  font-weight: 600;
  color: #111;
}

.view-option:hover {
  background: #fff;
  transform: translateY(-2px);
  box-shadow: 0 5px 14px rgba(0,0,0,0.08);
}

.view-option.active {
  background: linear-gradient(180deg, #fff7d6, #ffe99f);
  border-color: #f7de92;
  box-shadow: 0 3px 10px rgba(255, 230, 120, 0.3);
}
/* 🌙 ====== DARK MODE ====== */
body {
  transition: background 0.4s ease, color 0.4s ease;
}

/* الوضع الليلي */
body.dark {
  --bg:#111827;
  --ink:#f9fafb;
  --muted:#9ca3af;
  --card:#1f2937;
  --soft:#374151;
  --line:#4b5563;
  --chip:#2d3748;
  --chip-ink:#e5e7eb;
  --shadow:0 8px 24px rgba(0,0,0,.6);
  --brand:#f6c94c;
  background: var(--bg);
  color: var(--ink);
}

/* الخلفيات والبطاقات */
body.dark .app {
  background:linear-gradient(135deg, rgba(31,41,55,0.9), rgba(17,24,39,0.9));
  box-shadow:0 10px 40px rgba(0,0,0,0.4);
}

body.dark .nav a {
  color:var(--muted);
}
body.dark .nav a.active {
  background:var(--brand);
  color:#111;
}

body.dark .icon-btn {
  background:var(--soft);
  color:var(--ink);
  border-color:var(--line);
  transition:all 0.3s ease;
}

body.dark #gridView > div,
body.dark table,
body.dark .card {
  background:var(--card);
  border-color:var(--line);
  color:var(--ink);
}

/* الأزرار */
body.dark .btn,
body.dark button {
  background:linear-gradient(180deg,#2d3748,#1f2937);
  color:#f9fafb;
  border-color:var(--line);
}

/* الشيبس */
body.dark .chip {
  background:var(--chip);
  color:var(--chip-ink);
}

/* تأثير التبديل */
html, body, .app {
  transition: all 0.4s ease;
}
/* 🌑 ====== DARK MODE — FULL REFINEMENT ====== */

/* 🔹 الخلفية العامة */
body.dark .bg-wrap {
  display: none; /* إزالة الخلفيات الصفراء الفاتحة */
}
body.dark {
  background: radial-gradient(circle at top left, #1e1e2f 0%, #111827 70%);
  color: var(--ink);
}

/* 🔹 الهيدر العلوي */
body.dark header.appbar {
  background: linear-gradient(180deg, rgba(31,41,55,0.85), rgba(17,24,39,0.8));
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(8px);
}
body.dark .brand-badge {
  background: var(--brand);
  color: #111;
}
body.dark .nav a:hover {
  background: rgba(255,255,255,0.06);
}

/* 🔹 زر الإعدادات */
body.dark .icon-btn:hover {
  background: var(--brand);
  color: #111;
  transform: rotate(45deg);
}

/* 🔹 عناوين الأقسام */
body.dark .bar h1 {
  color: var(--brand);
}
body.dark .meter .label {
  color: var(--muted);
}

/* 🔹 الميترز (العدادات الصغيرة) */
body.dark .meter {
  background: rgba(255,255,255,0.05);
  border-color: var(--line);
}
body.dark .progress {
  background: var(--soft);
}
body.dark .progress > span {
  background: linear-gradient(90deg, #f6c94c, #ffe48a);
}

/* 🔹 الأزرار العامة */
body.dark .view-option {

  border-color: var(--line);
  color: var(--ink);
  box-shadow: 0 3px 8px rgba(0,0,0,0.4);
}
body.dark .view-option.active {

  color: #111;
  box-shadow: 0 3px 14px rgba(255,230,120,0.4);
}

/* 🔹 الجداول */
body.dark table {
  background: var(--card);
  border: 1px solid var(--line);
}
body.dark thead th {
  background: rgba(255,255,255,0.05);
  color: var(--brand);

}
body.dark tbody td {
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
body.dark tbody tr:hover td {
  background: rgba(255,255,255,0.05);
}

/* 🔹 الكروت (البطاقات في Grid View) */
body.dark #gridView > div {
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}
body.dark #gridView > div:hover {
  box-shadow: 0 12px 32px rgba(0,0,0,0.6);
}

/* 🔹 التفاصيل داخل الكروت */
body.dark #gridView h3 {
  color: var(--ink);
}
body.dark #gridView p {
  color: var(--muted);
}
body.dark #gridView button {
  background: linear-gradient(180deg, #f6c94c, #ffe99f);
  color: #111;
  border-color: #f7de92;
}

/* 🔹 الشيبس (Tags) */
body.dark .chip {
  background: rgba(255,255,255,0.08);
  color: var(--chip-ink);
  border-color: rgba(255,255,255,0.1);
}
body.dark .chip.good {
  background: rgba(16,185,129,0.15);
  color: #a7f3d0;
}
body.dark .chip.warn {
  background: rgba(245,158,11,0.15);
  color: #fde68a;
}
body.dark .chip.bad {
  background: rgba(239,68,68,0.15);
  color: #fecaca;
}

/* 🔹 النصوص الثانوية */
body.dark .hint,
body.dark .muted {
  color: var(--muted);
}

/* 🔹 الأزرار المصغّرة */
body.dark .btn-mini {
  background: var(--soft);
  border-color: var(--line);
  color: var(--ink);
}
body.dark .btn-mini.brand {
  background: linear-gradient(180deg, #f6c94c, #ffe99f);
  color: #111;
}

/* 🔹 التبديلات والأنيميشن */
body.dark .seg {
  background: var(--soft);
  border-color: var(--line);
}
body.dark .seg button.active {
  background: var(--brand);
  color: #111;
}

/* 🔹 الفوتر أو أي عناصر لاحقًا */
body.dark footer {
  background: #111827;
  color: var(--muted);
  border-top: 1px solid var(--line);
}
body .h3header {
  color: #111827; /* أسود في الوضع الفاتح */
}

/* 🌟 لون h3header في الوضع الليلي */
body.dark .h3header {
  background: #010101;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 700;
}

body.dark tbody td {
  color: #030304; /* النص داخل الصفوف أفتح */
  background: rgba(255,255,255,0.03); /* خلفية خفيفة تفصل الصفوف */

}

body.dark tbody tr:hover td {
  background: rgba(73, 203, 255, 0.281); /* تمييز الصف عند المرور */
  color: #ff0000;
}tbody tr:hover td {
  background: rgba(255, 234, 0, 0.182); /* تمييز الصف عند المرور */
  color: #ff0000;
}
#tableView .chip {
  font-size: 0.75rem;
  padding: 4px 8px;
  margin: 2px;
  display: inline-block;
}
/* 🌟 Professional Table View Enhancement */
#tableView table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0 10px;
  font-size: 0.9rem;
  border: none;
}

#tableView thead th {

  font-weight: 700;
  color: #374151;
  background: linear-gradient(90deg, #f9fafb, #f3f4f6);

  border-bottom: 2px solid #e5e7eb;

  padding: 14px 16px;

}

/* 📊 Sorting Enhancements */
th.sortable {
  cursor: pointer;
  position: relative;
  user-select: none;
  transition: all 0.2s ease;
}

th.sortable:hover {
  background: #fffbe6;
  color: #111;
}

th.sortable::after {
  content: "";
  position: absolute;
  right: 10px;
  top: 50%;
  width: 8px;
  height: 8px;
  border-right: 2px solid #9ca3af;
  border-bottom: 2px solid #9ca3af;
  transform: translateY(-50%) rotate(45deg);
  opacity: 0.3;
  transition: all 0.3s ease;
}

th.sortable.asc::after {
  transform: translateY(-50%) rotate(-135deg);
  opacity: 0.7;
  border-color: #111;
}

th.sortable.desc::after {
  transform: translateY(-50%) rotate(45deg);
  opacity: 0.7;
  border-color: #111;
}

/* الوضع الليلي */
body.dark th.sortable:hover {
  background: rgba(255,230,120,0.1);
}
body.dark #globalSearch {
  color: #f9fafb;
}

body.dark div[style*="border-radius:999px"] input {
  color: #f9fafb;
}

body.dark div[style*="border-radius:999px"] {
  background: #1f2937 !important;
  border-color: #374151 !important;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);

body.dark .fa-search {
  color: #9ca3af !important;
}

  background: #1f2937;

  border-color: #374151;

body.dark #searchToggle {

// 🔹 دالة تصدير Excel
function exportToExcel(data, filename = "data.xlsx") {
  if (!data.length) return alert("No data to export!");
  const headers = Object.keys(data[0]);
  const rows = [headers, ...data.map(obj => headers.map(h => obj[h]))];
  const sheet = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheet, "Data");
  XLSX.writeFile(wb, filename);
}

// 🔹 دالة تصدير PDF
function exportToPDF(data, filename = "data.pdf") {
  if (!data.length) return alert("No data to export!");
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "landscape" });
  const headers = Object.keys(data[0]);
  const rows = data.map(obj => headers.map(h => obj[h]));
  doc.autoTable({
    head: [headers],
    body: rows,
    theme: "striped",
    headStyles: { fillColor: [33, 150, 243] },
    styles: { fontSize: 9 },
    margin: { top: 20 },
  });
  doc.save(filename);
}

// 🔹 دالة لجلب البيانات الظاهرة فقط من Grid أو Table بعد الفلترة
function getVisibleData() {
  const tableViewVisible = document.getElementById("tableView")?.style.display !== "none";
  const gridViewVisible = document.getElementById("gridView")?.style.display !== "none";

  if (!latestPatients || !latestPatients.length) return [];

  if (tableViewVisible) {
    const visibleRows = Array.from(document.querySelectorAll("#tableView tbody tr"))
      .filter(tr => tr.style.display !== "none");
    const visibleNames = visibleRows.map(tr => tr.children[0]?.innerText.trim().toLowerCase());
    return latestPatients.filter(p => visibleNames.includes((p["patient Name"] || "").toLowerCase()));
  }

  if (gridViewVisible) {
    const visibleCards = Array.from(document.querySelectorAll("#gridView > div"))
      .filter(div => div.style.display !== "none");
    const visibleNames = visibleCards.map(card => {
      const h3 = card.querySelector("h3");
      return h3 ? h3.textContent.trim().toLowerCase() : "";
    });
    return latestPatients.filter(p => visibleNames.includes((p["patient Name"] || "").toLowerCase()));
  }

  return latestPatients;
}

document.querySelectorAll(".export-option").forEach(opt => {

    const tableView = document.getElementById("tableView");
    const gridView = document.getElementById("gridView");

    const isDashboard = dashView && dashView.style.display === "block";
    const isTable = tableView && tableView.style.display !== "none";
    const isGrid = gridView && gridView.style.display !== "none";

    // 🟢 PDF فقط للـ Dashboard
    if (type === "pdf" && isDashboard) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF("landscape", "pt", "a4");

      // نأخذ صورة من عنصر الداشبورد
      const dashElement = dashView.querySelector(".container");
      if (!dashElement) return alert("Dashboard not found!");

      const canvas = await html2canvas(dashElement, { scale: 2 });
      const imgData = canvas.toDataURL("image/png");

      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();
      const imgWidth = pageWidth - 60;
      const imgHeight = (canvas.height * imgWidth) / canvas.width;

      doc.addImage(imgData, "PNG", 30, 30, imgWidth, imgHeight);
      doc.save("PHDU-Dashboard.pdf");
      return;
    }

    // 🟨 Excel فقط للـ Grid أو Table
    if (type === "excel" && (isTable || isGrid)) {
      const visibleData = getVisibleData();
      if (!visibleData.length) return alert("No data to export!");

      const titleText = document.querySelector(".bar h1")?.textContent || "";
      const selectedYear = titleText.split(" ")[0] || "All";
      exportToExcel(visibleData, `${selectedYear}-filtered-patients.xlsx`);
      return;
    }

    alert("⚠️ Export not available in this view!");
  });
});

/* =============================
   📊 Enable Sorting on Table
============================= */
document.addEventListener("DOMContentLoaded", () => {
  const table = document.querySelector("#tableView table");
  if (!table) return;
  const headers = table.querySelectorAll("th.sortable");

  headers.forEach((header, index) => {
    header.addEventListener("click", () => {
      const tbody = table.querySelector("tbody");
      const rows = Array.from(tbody.querySelectorAll("tr"));
      const isAsc = header.classList.toggle("asc");
      header.classList.toggle("desc", !isAsc);

      // إزالة الأسهم من الأعمدة الأخرى
      headers.forEach(h => { if (h !== header) h.classList.remove("asc", "desc"); });

      const colIndex = index;

      const sortedRows = rows.sort((a, b) => {
        const aText = a.children[colIndex]?.innerText.trim().toLowerCase();
        const bText = b.children[colIndex]?.innerText.trim().toLowerCase();

        if (!isNaN(aText) && !isNaN(bText)) {
          return isAsc ? aText - bText : bText - aText;
        }
        return isAsc ? aText.localeCompare(bText) : bText.localeCompare(aText);
      });

      tbody.innerHTML = "";
      sortedRows.forEach(row => tbody.appendChild(row));
    });
  });
});

      const text = row.innerText.toLowerCase();
      row.style.display = text.includes(filter) ? "" : "none";
    });
  });
});
/* =======================================
   🔍 Expandable Search Button Animation
======================================= */
const searchToggle = document.getElementById("searchToggle");
const searchInput = document.getElementById("globalSearch");

if (searchToggle && searchInput) {
  searchToggle.addEventListener("click", () => {
    const isExpanded = searchInput.style.width && searchInput.style.width !== "0px";

    if (!isExpanded) {
      // 🔹 افتح البحث
searchInput.style.width = "360px"; // 🔹 أطول وأجمل
      searchInput.style.opacity = "1";
      searchInput.focus();
      searchToggle.style.background = "var(--brand)";
      searchToggle.style.color = "#111";
    } else {
      // 🔹 أغلق البحث
      searchInput.style.width = "0";
      searchInput.style.opacity = "0";
      searchToggle.style.background = "#fff";
      searchToggle.style.color = "#111";
    }
  });

  // 🔹 إغلاق تلقائي عند فقدان التركيز
  searchInput.addEventListener("blur", () => {
    setTimeout(() => {
      searchInput.style.width = "0";
      searchInput.style.opacity = "0";
      searchToggle.style.background = "#fff";
      searchToggle.style.color = "#111";
    }, 200);
  });

  // 🔹 البحث الحي في Grid + Table
  searchInput.addEventListener("input", () => {
    const filter = searchInput.value.toLowerCase();

    // Grid
    document.querySelectorAll("#gridView > div").forEach(card => {
      const text = card.innerText.toLowerCase();
      card.style.display = text.includes(filter) ? "flex" : "none";
    });

    // Table
    document.querySelectorAll("#tableView tbody tr").forEach(row => {
      const text = row.innerText.toLowerCase();
      row.style.display = text.includes(filter) ? "" : "none";
    });
  });
}

// دالة لتوليد الأقسام
function section(title, items) {
  const rows=items.map(i=>`
    <div class="item">
      <strong>${i.label}</strong>
      <span>${i.value || "-"}</span>
    </div>`).join("");
  return `
  <div class="section">
    <h3>${title}</h3>
    <div class="grid">${rows}</div>
  </div>`;
}
